name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main  # Adjust this if your default branch is master or src
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false # Kept false to protect multi-step production builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Crucial for downloading the Academic theme
          fetch-depth: 0         # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4 # Configures deployment metadata automatically

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3   # The standard, reliable Hugo setup action
        with:
          hugo-version: 'latest'
          extended: true                  # Academic/Blox themes require Sass (extended)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Hugo and Pagefind
        env:
          HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache # Optional but speeds up builds
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: "${{ steps.pages.outputs.base_url }}/"
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4